[build-system]
requires = ["scikit-build-core>=0.9", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cacache"
version = "0.1.0"
description = "CA-orchestrated RAG cache — Cellular Automata controls cache tier promotion/demotion"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "numpy", "cachetools", "plotly", "jupyter"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/cacache"]
